workflows:
  ios-testflight:
    name: NetNewsWire Internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: bytefish
    environment:
      xcode: "27.2"
      vars:
        APPLE_TEAM_ID: H6YMY75W28
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sh.bytefi.NetNewsWire.iOS
    scripts:
      - name: Prepare fork signing and build settings
        script: |
          set -euo pipefail
          mkdir -p ../SharedXcodeSettings build
          cat > ../SharedXcodeSettings/DeveloperSettings.xcconfig <<EOF
          ORGANIZATION_IDENTIFIER = sh.bytefi
          DEVELOPER_ENTITLEMENTS = -dev
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF
          # The project uses synchronized xcconfig references. Set the profiles in the
          # target xcconfigs so Xcode can resolve them without rewriting the project.
          printf '\nPROVISIONING_PROFILE_SPECIFIER = Reader iOS\n' >> xcconfig/NetNewsWire_iOSapp_target.xcconfig
          printf '\nPROVISIONING_PROFILE_SPECIFIER = Reader Shared\n' >> xcconfig/NetNewsWire_iOSshareextension_target.xcconfig
          printf '\nPROVISIONING_PROFILE_SPECIFIER = Reader Widgets\n' >> xcconfig/NetNewsWire_iOSwidgetextension_target.xcconfig
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>sh.bytefi.NetNewsWire.iOS</key><string>Reader iOS</string>
              <key>sh.bytefi.NetNewsWire.iOS.Share-Extension</key><string>Reader Shared</string>
              <key>sh.bytefi.NetNewsWire.iOS.SpringboardWidgets</key><string>Reader Widgets</string>
            </dict>
          </dict>
          </plist>
          EOF
          bash buildscripts/updateSecrets.sh
      - name: Archive and export iOS app
        script: |
          set -euo pipefail
          mkdir -p build
          if ! xcode-project build-ipa \
            --project NetNewsWire.xcodeproj \
            --scheme NetNewsWire-iOS \
            --config Release \
            --export-options-plist build/ExportOptions.plist \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=${PROJECT_BUILD_NUMBER}" \
            --disable-xcpretty 2>&1 | tee build/archive.log; then
            grep -n -B 2 -A 4 'error:' build/archive.log || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/archive.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
